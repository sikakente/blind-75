[project]
name = "blind75"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "py-console",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "--durations=10 --durations-min=1.0 -vv"
testpaths = ["."]
